<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>BODY &amp; PAINT PERINTIS PERKASA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF0F3; --surface:#FFFFFF; --surface-2:#E4E8ED; --surface-3:#D9DEE5;
    --ink:#1C2430; --ink-2:#4B5768; --ink-3:#8993A4;
    --line:#DCE1E7; --line-strong:#C3CAD3;
    --accent:#C2570F; --accent-ink:#FFFFFF; --accent-soft:#FBE7D6; --accent-strong:#9C4409;
    --good:#187A50; --good-soft:#DEF3E7; --good-ink:#0E5236;
    --warn:#8A650A; --warn-soft:#FBEFCB; --warn-ink:#6B4E06;
    --bad:#B23434; --bad-soft:#FBE1E1; --bad-ink:#8A2323;
    --info:#2A579C; --info-soft:#E1EAF8; --info-ink:#1E3F73;
    --shadow-sm:0 1px 2px rgba(20,26,36,.07);
    --shadow-md:0 8px 24px rgba(20,26,36,.10);
    --radius:10px; --radius-lg:18px;
    --font-display:'Big Shoulders Display',"Arial Narrow",sans-serif;
    --font-body:'Public Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#14181F; --surface:#1B212B; --surface-2:#242C38; --surface-3:#2E3847;
      --ink:#EDEFF3; --ink-2:#B7BFCC; --ink-3:#7B8494;
      --line:#333D4C; --line-strong:#455066;
      --accent:#E58339; --accent-ink:#1B1206; --accent-soft:#3A2413; --accent-strong:#F4995A;
      --good:#3FCB8D; --good-soft:#123326; --good-ink:#8FE8BE;
      --warn:#E4B93F; --warn-soft:#362A0D; --warn-ink:#F3D480;
      --bad:#E97878; --bad-soft:#3A1414; --bad-ink:#F5A9A9;
      --info:#7CA7E8; --info-soft:#17233A; --info-ink:#AFC9F0;
      --shadow-sm:0 1px 2px rgba(0,0,0,.35);
      --shadow-md:0 8px 28px rgba(0,0,0,.45);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14181F; --surface:#1B212B; --surface-2:#242C38; --surface-3:#2E3847;
    --ink:#EDEFF3; --ink-2:#B7BFCC; --ink-3:#7B8494;
    --line:#333D4C; --line-strong:#455066;
    --accent:#E58339; --accent-ink:#1B1206; --accent-soft:#3A2413; --accent-strong:#F4995A;
    --good:#3FCB8D; --good-soft:#123326; --good-ink:#8FE8BE;
    --warn:#E4B93F; --warn-soft:#362A0D; --warn-ink:#F3D480;
    --bad:#E97878; --bad-soft:#3A1414; --bad-ink:#F5A9A9;
    --info:#7CA7E8; --info-soft:#17233A; --info-ink:#AFC9F0;
    --shadow-sm:0 1px 2px rgba(0,0,0,.35);
    --shadow-md:0 8px 28px rgba(0,0,0,.45);
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font-body);
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
    padding-inline:16px;
  }
  h1,h2,h3,h4{font-family:var(--font-display); font-weight:700; letter-spacing:.01em; text-wrap:balance; margin:0;}
  a{color:var(--accent);}
  button{font-family:var(--font-body);}
  input,select,textarea{font-family:var(--font-body); font-size:14px;}
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--surface-3); border-radius:8px;}

  #app{max-width:1240px; margin:0 auto; padding-block:20px 48px;}
  .hidden{display:none !important;}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    flex-wrap:wrap; padding:14px 18px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); margin-bottom:18px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:38px;height:38px;border-radius:9px;background:var(--accent);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);
    font-weight:800;font-size:18px;flex:none;
  }
  .brand-text h1{font-size:19px;}
  .brand-text p{margin:0;font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.09em;}
  .topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .role-pill{
    display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:999px;padding:6px 12px 6px 6px;font-size:13px;
  }
  .role-pill .dot{width:9px;height:9px;border-radius:50%;background:var(--good);flex:none;}
  .btn{
    appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
    padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;transition:background .12s,border-color .12s;
    white-space:nowrap;
  }
  .btn:hover{background:var(--surface-2);}
  .btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.stage-head:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  .btn-accent{background:var(--accent);border-color:var(--accent-strong);color:var(--accent-ink);}
  .btn-accent:hover{background:var(--accent-strong);}
  .btn-ghost{border-color:transparent;background:transparent;}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:8px;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}

  /* ---------- Role gate ---------- */
  .gate-wrap{
    min-height:70vh;display:flex;align-items:center;justify-content:center;padding-block:40px;
  }
  .gate-card{
    width:100%;max-width:460px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:30px 28px;
  }
  .gate-card h2{font-size:26px;margin-bottom:4px;}
  .gate-card .sub{color:var(--ink-2);font-size:13px;margin-bottom:22px;}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .field label{font-size:12.5px;font-weight:600;color:var(--ink-2);}
  .field .hint{font-size:11.5px;color:var(--ink-3);font-weight:400;}
  input[type=text],input[type=password],input[type=tel],input[type=number],input[type=date],input[type=datetime-local],select,textarea{
    width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line-strong);
    background:var(--surface);color:var(--ink);
  }
  textarea{resize:vertical;min-height:56px;}
  input:disabled,select:disabled,textarea:disabled{background:var(--surface-2);color:var(--ink-3);cursor:not-allowed;}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
  .role-opt{
    border:1px solid var(--line-strong);border-radius:10px;padding:10px 10px;cursor:pointer;
    background:var(--surface);font-size:12.5px;font-weight:600;text-align:left;
  }
  .role-opt.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong);}

  /* ---------- Dashboard ---------- */
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;}
  .stat-tile{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
    padding:14px 16px;box-shadow:var(--shadow-sm);
  }
  .stat-tile .label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700;}
  .stat-tile .value{font-family:var(--font-display);font-size:30px;line-height:1.1;margin-top:4px;}
  .stat-tile .sub{font-size:11.5px;color:var(--ink-3);margin-top:3px;}
  .stat-tile.accent{border-color:var(--accent);}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;}
  .badge-light{background:var(--good-soft);color:var(--good-ink);}
  .badge-medium{background:var(--warn-soft);color:var(--warn-ink);}
  .badge-heavy{background:var(--bad-soft);color:var(--bad-ink);}
  .badge-info{background:var(--info-soft);color:var(--info-ink);}
  .badge-neutral{background:var(--surface-2);color:var(--ink-2);}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line);}
  .panel-head h2{font-size:17px;}
  .panel-body{padding:14px 18px;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .toolbar input,.toolbar select{width:auto;min-width:140px;}
  .search-box{position:relative;flex:1;min-width:180px;}
  .search-box input{padding-left:30px;}
  .search-box svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.5;}

  table{width:100%;border-collapse:collapse;}
  .table-wrap{overflow-x:auto;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
     padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
  td{padding:10px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle;white-space:nowrap;}
  tbody tr{cursor:pointer;}
  tbody tr:hover{background:var(--surface-2);}
  .veh-id{font-weight:700;}
  .veh-sub{font-size:11.5px;color:var(--ink-3);}

  .progress-track{display:flex;gap:2px;width:100%;min-width:160px;}
  .progress-seg{height:7px;flex:1;border-radius:3px;background:var(--surface-3);}
  .progress-seg.done{background:var(--good);}
  .progress-seg.current{background:var(--accent);}
  .progress-seg.stopped{background:var(--bad);}

  .empty-state{padding:34px 18px;text-align:center;color:var(--ink-3);}

  /* ---------- Detail drawer ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(15,18,24,.45);display:flex;justify-content:flex-end;
    z-index:40;
  }
  .drawer{
    width:min(720px,100%);background:var(--bg);height:100%;overflow-y:auto;
    box-shadow:-12px 0 30px rgba(0,0,0,.18);
  }
  .drawer-head{
    position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);
    padding:16px 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  }
  .drawer-head h2{font-size:22px;}
  .drawer-head .veh-sub{margin-top:2px;}
  .drawer-body{padding:16px 20px 60px;display:flex;flex-direction:column;gap:12px;}

  .stage-card{border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);overflow:hidden;}
  .stage-head{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:13px 16px;background:none;border:none;cursor:pointer;text-align:left;
  }
  .stage-head .ttl{display:flex;align-items:center;gap:10px;}
  .stage-num{
    font-family:var(--font-display);font-weight:800;font-size:15px;color:var(--ink-3);
    width:26px;height:26px;border-radius:7px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none;
  }
  .stage-num.done{background:var(--good);color:#fff;}
  .stage-num.current{background:var(--accent);color:var(--accent-ink);}
  .stage-head h3{font-size:15px;}
  .stage-head .role-tag{font-size:10.5px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
  .chev{transition:transform .15s;color:var(--ink-3);flex:none;}
  .stage-card.open .chev{transform:rotate(180deg);}
  .stage-content{display:none;padding:4px 16px 16px;border-top:1px solid var(--line);}
  .stage-card.open .stage-content{display:block;}
  .qc-approve-bar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    background:var(--surface-2);border:1px dashed var(--line-strong);border-radius:10px;
    padding:10px 12px;margin-top:10px;
  }
  .qc-approve-bar.approved{background:var(--good-soft);border:1px solid var(--good);}
  .qc-approve-bar .qc-approve-info{display:flex;flex-direction:column;gap:2px;font-size:12.5px;}
  .qc-approve-bar.approved .qc-approve-info strong{color:var(--good-ink);}
  .qc-approve-bar .hint{font-size:11.5px;color:var(--ink-3);font-weight:400;max-width:420px;}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:10px;}
  @media (max-width:640px){.field-grid{grid-template-columns:1fr;}}
  .field-grid .field.wide{grid-column:1/-1;}
  .computed-box{
    background:var(--info-soft);color:var(--info-ink);border-radius:8px;padding:7px 10px;font-size:12.5px;
    display:flex;justify-content:space-between;gap:8px;font-weight:600;
  }
  .readonly-note{font-size:11px;color:var(--ink-3);margin-top:8px;font-style:italic;}
  .divider-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:8px 0 -2px;}

  .toast-wrap{position:fixed;bottom:18px;right:18px;z-index:80;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-md);max-width:320px;}
  :root:not([data-theme="light"]) .toast, :root[data-theme="dark"] .toast{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);}

  .footer-note{margin-top:22px;font-size:11.5px;color:var(--ink-3);text-align:center;line-height:1.6;}
  .kbd{font-family:var(--font-mono);background:var(--surface-2);padding:1px 6px;border-radius:4px;font-size:11px;}

  .modal-mask{position:fixed;inset:0;background:rgba(15,18,24,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;}
  .modal-box{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:22px;}
  .modal-box h2{font-size:20px;margin-bottom:14px;}
</style>

<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* =========================================================================
   ⚠️ WAJIB DIISI SEBELUM DI-HOSTING ⚠️
   Tempel URL Web App Google Apps Script Anda di sini (hasil dari langkah
   "Deploy > New deployment > Web app" di Apps Script — lihat panduan
   setup yang menyertai file ini). Contoh:
   'https://script.google.com/macros/s/AKfycb.../exec'
   Selama masih kosong, aplikasi berjalan dalam MODE PRATINJAU (data contoh,
   tidak tersimpan permanen) supaya halaman tidak pernah tampil kosong/rusak.
   ========================================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycby4IZkQHFtI3SJ2iYtS_lWu9W29feNIxUNSPosiZwAsWiHISMWGlyPGXbYWNiU-8HQ/exec';

/* Jeda polling (ms) untuk menyegarkan data dari Google Sheets — pendekatan
   "hampir realtime" karena Apps Script tidak mendukung push/realtime asli
   seperti Firestore. 8 detik cukup responsif tanpa membebani kuota Apps
   Script (kuota gratis: 20.000 panggilan URL Fetch/hari per akun). */
const POLL_INTERVAL_MS = 8000;

/* =========================================================================
   LACAK BODY & PAINT — konfigurasi data & referensi
   Satu sumber kebenaran untuk semua dropdown, tahap, dan field.
   ========================================================================= */

/* =========================================================================
   USER ID & PASSWORD — login per PIC, akses dibatasi otomatis sesuai POS.
   Kepala Bengkel & Admin Head (fullAccess:true) bisa masuk ke SEMUA POS;
   PIC lain hanya bisa mengisi/mengedit field milik POS-nya sendiri (field
   di luar POS-nya tampil non-aktif/disabled, sama seperti sebelumnya, tapi
   sekarang gerbang masuknya lewat User ID+Password, bukan pilih peran bebas).
   Pola ini identik dengan versi Artifact (v2) — lihat catatan proyek.
   ========================================================================= */
const ROLE_DEFS = {
  sa:      {label:'Service Advisor (SA)', fieldRoles:['sa']},
  partman: {label:'Partman', fieldRoles:['partman']},
  qc:      {label:'QC Produksi (termasuk Washing)', fieldRoles:['qc','washing']},
  billing: {label:'Billing', fieldRoles:['billing']},
  admin:   {label:'Kepala Bengkel / Admin Head', fieldRoles:['sa','partman','qc','washing','billing','admin'], fullAccess:true},
};

// Password awal dibuat otomatis (pola: userid+123) — sampaikan daftar ini ke
// masing-masing PIC, dan boleh diganti kapan saja dengan menyunting daftar
// ini lalu deploy ulang. Ini BUKAN sistem otentikasi server-side sungguhan
// (lihat catatan keamanan di dokumentasi) — level keamanannya setara larangan
// akses UI berbasis kepercayaan tim, hanya sekarang butuh User ID+Password
// yang benar dulu untuk bisa masuk.
const USERS = [
  {id:'tri',       password:'tri123',       name:'Tri Susilo Purnomo', role:'sa'},
  {id:'nizar',     password:'nizar123',     name:'Nizar Lubis',        role:'sa'},
  {id:'feri',      password:'feri123',      name:'Feri Prayogi',       role:'sa'},
  {id:'indra',     password:'indra123',     name:'Indra',              role:'qc'},
  {id:'sumantri',  password:'sumantri123',  name:'Sumantri',           role:'qc'},
  {id:'fahri',     password:'fahri123',     name:'Fahri',              role:'qc'},
  {id:'reza',      password:'reza123',      name:'Reza',               role:'qc'},
  {id:'rifai',     password:'rifai123',     name:'Muhammad Rifai',     role:'admin', roleLabel:'Kepala Bengkel'},
  {id:'steven',    password:'steven123',    name:'Steven',             role:'billing'},
  {id:'tika',      password:'tika123',      name:'Tika',               role:'billing'},
  {id:'neta',      password:'neta123',      name:'Neta',               role:'admin', roleLabel:'Admin Head'},
  {id:'antony',    password:'antony123',    name:'Antony',             role:'partman'},
  {id:'valentino', password:'valentino123', name:'Valentino',          role:'partman'},
];
function findUser(userId){
  const uid = String(userId||'').trim().toLowerCase();
  return USERS.find(u=>u.id===uid) || null;
}
function attemptLogin(userId, password){
  const u = findUser(userId);
  if(!u || u.password!==password) return null;
  return u;
}

const BRAND_MODELS = {
  'Toyota': ['Avanza','Veloz','Innova Zenix','Kijang Innova','Fortuner','Rush','Yaris','Vios','Agya','Calya','Camry','Corolla Cross','Corolla Altis','Raize','Hilux','Land Cruiser','Alphard','Voxy','Sienta','Lainnya'],
  'Daihatsu': ['Xenia','Terios','Ayla','Sigra','Rocky','Gran Max','Lainnya'],

  'Suzuki': ['Ertiga','XL7','Baleno','Ignis','Carry','APV','Lainnya'],
  'Mitsubishi': ['Xpander','Pajero Sport','Triton','Outlander','Lainnya'],

  'Mazda': ['Mazda2','Mazda3','CX-3','CX-5','Lainnya'],

};
const BRANDS = Object.keys(BRAND_MODELS);

const COLORS = ['Putih','Hitam','Silver','Abu-abu','Merah','Biru','Kuning','Hijau','Coklat','Emas/Gold','Krem','Maroon','Orange','Ungu','Dua Warna / Lainnya'];
const TRANSMISI_LIST = ['Matic','Manual'];
const CUSTOMER_TYPES = ['Asuransi','Cash','TWC'];
const INSURERS = ['Asuransi Astra (Garda Oto)','Adira Insurance','ACA Asuransi','Sinarmas','Tugu Insurance','MSIG Indonesia','ABDA','Asuransi Wahana Tata','AXA Insurance Indonesia','Zurich Asuransi Indonesia','Simas Insurtech','KB Insurance Indonesia','Lainnya'];
const STATUS_LAPOR_LIST = ['Lapor dari Bengkel','TPL','TLO','Estimasi','SPE','SPK Terbit','Customer Bawa SPK','Ditolak','Batal','Claim Banding'];
const POSISI_LIST = ['Mobil Dibawa Pelanggan','Tinggal Dibengkel'];

function panelStatus(n){
  if(n===''||n===null||n===undefined||isNaN(n)) return null;
  n = Number(n);
  if(n<=3.0) return 'Light';
  if(n<=7.9) return 'Medium';
  return 'Heavy';
}

/* =========================================================================
   TAHAP & FIELD — 114 fitur dipetakan jadi field flat per kendaraan.
   Setiap field: {key, label, type, role, options?, unit?, showIf?, required?}
   type: text | tel | number | date | datetime | select | textarea | checkbox | computed
   ========================================================================= */

function qcStage(key, title, waitingLabel, hasilOptions, hasMekanik, nextLabel){
  const fields = [];
  fields.push({key:'waiting_'+key, label:waitingLabel, type:'computed', unit:'hari'});
  fields.push({key:key+'_mulai', label:'Tanggal & Jam Mulai '+title, type:'datetime', role:'qc'});
  if(hasMekanik) fields.push({key:key+'_mekanik', label:'Nama Mekanik', type:'text', role:'qc'});
  fields.push({key:key+'_qc', label:'Nama QC ('+title+')', type:'text', role:'qc'});
  fields.push({key:key+'_stop_at', label:'Job Stoppage — Tanggal & Jam', type:'datetime', role:'qc'});
  fields.push({key:key+'_stop_alasan', label:'Job Stoppage — Alasan', type:'textarea', role:'qc',
    hint:'Wajib: SA dihubungi untuk perubahan janji penyerahan.'});
  fields.push({key:key+'_lanjut_at', label:'Lanjutkan Pengerjaan — Tanggal & Jam', type:'datetime', role:'qc'});
  fields.push({key:key+'_sa_ack', label:'SA Sudah Mengetahui / Dihubungi', type:'checkbox', role:'sa'});
  fields.push({key:key+'_hasil', label:'Hasil QC', type:'select', role:'qc', options:hasilOptions});
  fields.push({key:key+'_kesimpulan', label:'Kesimpulan & Approval QC', type:'textarea', role:'qc'});
  fields.push({key:key+'_selesai', label:'Tanggal & Jam Selesai '+title, type:'datetime', role:'qc'});
  if(nextLabel) fields.push({key:key+'_serah', label:'Serah Terima ke '+nextLabel, type:'checkbox', role:'qc'});
  return {key, title:title, roleLabel:'QC '+title, startField:key+'_mulai', finishField:key+'_selesai', fields,
    approval:{ qcField:key+'_qc', hasilField:key+'_hasil', hasilOk:hasilOptions[0],
      kesimpulanField:key+'_kesimpulan', selesaiField:key+'_selesai', serahField: nextLabel ? key+'_serah' : null }};
}

/* =========================================================================
   UTIL TANGGAL & FORMAT
   ========================================================================= */
function toDate(str){
  if(!str) return null;
  const d = new Date(str);
  return isNaN(d.getTime()) ? null : d;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){
  const da = toDate(a), db = toDate(b);
  if(!da||!db) return null;
  const diff = (db.getTime()-da.getTime())/86400000;
  return Math.round(diff*10)/10;
}
function fmtDate(str){
  const d = toDate(str);
  if(!d) return '—';
  return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
}
function fmtDateTime(str){
  const d = toDate(str);
  if(!d) return '—';
  return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})+' · '+d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
}
function fmtNum(n){
  if(n===null||n===undefined||n==='') return '—';
  return Number(n).toLocaleString('id-ID');
}
function fmtRupiah(n){
  if(n===null||n===undefined||n==='') return '—';
  return 'Rp'+Number(n).toLocaleString('id-ID');
}
function esc(s){
  return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function insurerLabel(v){
  if(v.nama_asuransi==='Lainnya') return v.nama_asuransi_lainnya || 'Lainnya (belum diisi)';
  return v.nama_asuransi;
}
function targetPenyerahan(v){
  return v.reschedule_janji_penyerahan || v.tgl_janji_penyerahan || null;
}
function debounce(fn, ms){
  let t; return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), ms); };
}

/* =========================================================================
   ENGINE PERHITUNGAN — leadtime, status, tahap berjalan
   ========================================================================= */
function computeDerived(v){
  const c = {};
  c.status_panel = panelStatus(v.jumlah_panel);
  c.leadtime_terbit_spk = daysBetween(v.tanggal_lapor_asuransi, v.tanggal_terbit_spk);
  c.masa_tunggu_spk = (v.tipe_customer==='Asuransi' && v.tanggal_lapor_asuransi && !v.tanggal_terbit_spk)
    ? daysBetween(v.tanggal_lapor_asuransi, todayISO()) : null;

  const masukBasis = v.tipe_customer==='Asuransi' ? v.tanggal_masuk_asuransi : v.tanggal_masuk_cash;
  const partBasis = v.tanggal_part_arrival || masukBasis;
  c.waiting_production = daysBetween(partBasis, v.panel_repair_mulai);
  c.waiting_panel_repair = c.waiting_production;
  c.waiting_persiapan_dempul = daysBetween(v.panel_repair_selesai, v.persiapan_dempul_mulai);
  c.waiting_colors_mixing = daysBetween(v.persiapan_dempul_selesai, v.colors_mixing_mulai);
  c.waiting_painting = daysBetween(v.colors_mixing_selesai, v.painting_mulai);
  c.waiting_poles = daysBetween(v.painting_selesai, v.poles_mulai);
  c.waiting_pemasangan = daysBetween(v.poles_selesai, v.pemasangan_mulai);
  c.waiting_final_inspection = daysBetween(v.pemasangan_selesai, v.final_inspection_mulai);
  c.waiting_washing = daysBetween(v.final_inspection_selesai, v.washing_mulai);
  c.waiting_penyerahan = daysBetween(v.washing_selesai, v.penyerahan_mulai);
  c.waiting_invoice = daysBetween(v.tanggal_berkas_ke_billing, v.billing_mulai);

  const piutangBasis = v.tanggal_penagihan_asuransi || v.billing_mulai || v.tanggal_berkas_ke_billing;
  if(piutangBasis){
    const end = (v.status_bayar==='Lunas' && v.tanggal_bayar) ? v.tanggal_bayar : todayISO();
    c.umur_piutang = daysBetween(piutangBasis, end);
  } else { c.umur_piutang = null; }

  c.total_leadtime = daysBetween(masukBasis, v.penyerahan_selesai);
  return c;
}

function stageState(idx, v){
  const stage = STAGE_DEFS[idx];
  const started = idx===0 ? true : !!(stage.startField && v[stage.startField]);
  let finished = !!(stage.finishField && v[stage.finishField]);
  if(stage.key==='billing' && v.status_bayar==='Lunas') finished = true;
  const next = STAGE_DEFS[idx+1];
  if(!finished && next && next.startField && v[next.startField]) finished = true;
  const stopKey = stage.key+'_stop_at', resumeKey = stage.key+'_lanjut_at';
  const stopped = started && !finished && !!v[stopKey] && !v[resumeKey];
  return {started, finished, stopped};
}

function vehicleSummary(v){
  let currentIdx = STAGE_DEFS.length; // default: semua selesai
  let anyStopped = false;
  for(let i=0;i<STAGE_DEFS.length;i++){
    const st = stageState(i, v);
    if(st.stopped) anyStopped = true;
    if(st.started && !st.finished){ currentIdx = i; break; }
  }
  const allDone = currentIdx===STAGE_DEFS.length;
  return {
    currentIdx,
    currentLabel: allDone ? 'Selesai' : STAGE_DEFS[currentIdx].title,
    allDone,
    anyStopped,
  };
}

function toast(msg, ms){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className='toast'; el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),320); }, ms||3200);
}

/* =========================================================================
   FOKUS TERJAGA SAAT RE-RENDER (supaya input tidak kehilangan kursor)
   ========================================================================= */
function withFocusPreserved(fn){
  const active = document.activeElement;
  const id = active && active.id;
  const tag = active && active.tagName;
  const hasSel = active && 'selectionStart' in active;
  const selStart = hasSel ? active.selectionStart : null;
  const selEnd = hasSel ? active.selectionEnd : null;
  fn();
  if(id){
    const el = document.getElementById(id);
    if(el && (tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')){
      el.focus();
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}

function doLogin(){
  const idEl = document.getElementById('gateUserId');
  const pwEl = document.getElementById('gatePassword');
  const uid = idEl ? idEl.value.trim() : '';
  const pw = pwEl ? pwEl.value : '';
  STATE.loginUserId = uid;
  const user = attemptLogin(uid, pw);
  if(!user){
    STATE.loginError = 'User ID atau Password salah. Hubungi Kepala Bengkel / Admin Head kalau lupa.';
    STATE.loginPassword = '';
    render();
    const pwEl2 = document.getElementById('gatePassword');
    if(pwEl2) pwEl2.focus();
    return;
  }
  STATE.loginError = '';
  STATE.loginPassword = '';
  setCurrentUser(user);
  saveSession();
  render();
}

function filteredVehicles(){

  return STATE.vehicles.filter(v=>{
    const sum = vehicleSummary(v);
    if(STATE.filterStage!=='all'){

      if(STATE.filterStage!=='selesai' && (sum.allDone || STAGE_DEFS[sum.currentIdx].key!==STATE.filterStage)) return false;

    if(STATE.filterCustomer!=='all' && v.tipe_customer!==STATE.filterCustomer) return false;

  const byPanel = {Light:0,Medium:0,Heavy:0};
  active.forEach(v=>{ const s=panelStatus(v.jumlah_panel); if(s) byPanel[s]++; });
  const stopped = active.filter(v=>vehicleSummary(v).anyStopped).length;
  const today = todayISO();
  const overdue = active.filter(v=>{ const t=targetPenyerahan(v); return t && t < today; }).length;

  return `
  <div class="stat-row">
    <div class="stat-tile accent">
      <div class="label">Kendaraan Aktif</div>
      <div class="value mono">${active.length}</div>

      <div class="value" style="font-size:15px;display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">

function fieldEditable(f){
  const rd = ROLE_DEFS[STATE.role];
  if(!rd) return false;
  if(rd.fullAccess) return true;
  return rd.fieldRoles.includes(f.role);
}

function buildFieldHTML(f, v, computed){
  if(f.showIf && !f.showIf(v)) return '';
  const fid = 'f_'+v.id+'_'+f.key;

  if(f.type==='computed'){
    let val = computed[f.key];
    let display;
    if(f.key==='status_panel'){
      display = val ? `<span class="badge badge-${val.toLowerCase()}">${val}</span>` : '—';
    } else {
      display = (val==null) ? '—' : (fmtNum(val)+(f.unit?' '+f.unit:''));
    }
    return `<div class="field wide"><div class="computed-box"><span>${esc(f.label)}</span><span class="mono">${display}</span></div></div>`;
  }

  const editable = fieldEditable(f);
  const disabledAttr = editable ? '' : 'disabled';
  const hint = f.hint ? `<span class="hint"> — ${esc(f.hint)}</span>` : '';
  let control = '';
  const val = v[f.key];

  if(f.type==='select'){
    control = `<select id="${fid}" data-field="${f.key}" data-vid="${v.id}" ${disabledAttr}>
      <option value="">— pilih —</option>
      ${f.options.map(o=>`<option value="${esc(o)}" ${val===o?'selected':''}>${esc(o)}</option>`).join('')}
    </select>`;
  } else if(f.type==='select-dependent'){
    const opts = (f.optionMap[v[f.dependsOn]] || []);
    control = `<select id="${fid}" data-field="${f.key}" data-vid="${v.id}" ${disabledAttr} ${opts.length?'':'disabled'}>
      <option value="">${opts.length?'— pilih —':'pilih brand dahulu'}</option>
      ${opts.map(o=>`<option value="${esc(o)}" ${val===o?'selected':''}>${esc(o)}</option>`).join('')}
    </select>`;
  } else if(f.type==='textarea'){
    control = `<textarea id="${fid}" data-field="${f.key}" data-vid="${v.id}" ${disabledAttr}>${esc(val||'')}</textarea>`;
  } else if(f.type==='checkbox'){
    return `<div class="field">
      <label style="display:flex;align-items:center;gap:8px;flex-direction:row;">
        <input type="checkbox" id="${fid}" data-field="${f.key}" data-vid="${v.id}" ${val?'checked':''} ${disabledAttr} style="width:auto;">
        ${esc(f.label)}${hint}
      </label>
    </div>`;
  } else if(f.type==='number'){
    control = `<input type="number" id="${fid}" data-field="${f.key}" data-vid="${v.id}" value="${val!=null?esc(val):''}" ${f.step?`step="${f.step}"`:''} ${f.min!=null?`min="${f.min}"`:''} ${disabledAttr}>`;
  } else if(f.type==='date'){
    control = `<input type="date" id="${fid}" data-field="${f.key}" data-vid="${v.id}" value="${esc(val||'')}" ${disabledAttr}>`;
  } else if(f.type==='datetime'){
    const dv = val ? String(val).slice(0,16) : '';
    control = `<input type="datetime-local" id="${fid}" data-field="${f.key}" data-vid="${v.id}" value="${esc(dv)}" ${disabledAttr}>`;
  } else if(f.type==='tel'){
    control = `<input type="tel" id="${fid}" data-field="${f.key}" data-vid="${v.id}" value="${esc(val||'')}" placeholder="62812xxxxxxx" ${disabledAttr}>`;
  } else {
    control = `<input type="text" id="${fid}" data-field="${f.key}" data-vid="${v.id}" value="${esc(val||'')}" ${disabledAttr}>`;
  }

  const wide = (f.type==='textarea') ? ' wide' : '';
  return `<div class="field${wide}"><label for="${fid}">${esc(f.label)}${hint}</label>${control}</div>`;
}

function buildApprovalBar(stage, v){

function normalizePhone(raw){
  let d = String(raw||'').replace(/[^0-9]/g,'');
  if(!d) return '';
  if(d.startsWith('0')) d = '62'+d.slice(1);
  else if(!d.startsWith('62')) d = '62'+d;
  return d;
}

/* =========================================================================
   API GOOGLE SHEETS (Google Apps Script Web App)
   GET  ?action=list           -> { ok:true, vehicles:[...] }
   POST { action:'add', data } -> { ok:true, id }
   POST { action:'update', id, patch } -> { ok:true }
   Body POST dikirim sebagai text/plain (bukan application/json) supaya
   browser tidak melakukan CORS preflight (OPTIONS) yang tidak didukung
   Apps Script — trik standar untuk menghubungkan halaman statis ke Apps
   Script Web App. Lihat panduan setup yang menyertai file ini.
   ========================================================================= */
function apiGet(params){
  const qs = new URLSearchParams(params).toString();
  const url = API_URL + (API_URL.includes('?') ? '&' : '?') + qs;
  return fetch(url, {method:'GET'}).then(r=>r.json());
}
function apiPost(body){
  return fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(body),
  }).then(r=>r.json());
}

function saveField(vid, key, value){
  bulkSaveFields(vid, {[key]:value});
}

function bulkSaveFields(vid, patch){
  const v = STATE.vehicles.find(x=>x.id===vid);
  if(v) Object.assign(v, patch);
  render();
  if(STATE.demoMode) return;
  apiPost({action:'update', id:vid, patch}).then(res=>{
    if(!res || res.ok===false) throw new Error(res && res.error || 'Respons API tidak valid');
  }).catch(err=>{
    toast('Gagal menyimpan ke Google Sheets: '+(err&&err.message||'tidak diketahui'));
  });
}

function nowLocalISOMinute(){
  const d = new Date();
  const tzOffset = d.getTimezoneOffset()*60000;
  return new Date(d.getTime()-tzOffset).toISOString().slice(0,16);
}

function approveQcStage(stageKey, vid){
  const stage = STAGE_DEFS.find(s=>s.key===stageKey);
  const v = STATE.vehicles.find(x=>x.id===vid);
  if(!stage || !stage.approval || !v) return;
  const ap = stage.approval;
  const qcName = (v[ap.qcField]||'').trim();
  if(!qcName){
    toast('Isi Nama QC terlebih dahulu, baru klik Setujui.');
    const el = document.getElementById('f_'+vid+'_'+ap.qcField);
    if(el){ el.focus(); }
    return;
  }
  const patch = {};
  patch[ap.hasilField] = ap.hasilOk;
  patch[ap.kesimpulanField] = 'Disetujui oleh '+qcName+'. Hasil QC: '+ap.hasilOk+'.';
  patch[ap.selesaiField] = nowLocalISOMinute();
  if(ap.serahField) patch[ap.serahField] = true;
  bulkSaveFields(vid, patch);
  toast('Tahap "'+stage.title+'" disetujui oleh '+qcName+'.');
}

function addVehicle(data){
  const id = 'v'+Date.now()+Math.floor(Math.random()*1000);
  data.id = id;
  data.createdAt = new Date().toISOString();
  if(STATE.demoMode){
    STATE.vehicles.push(data);
    STATE.showNewModal = false;
    STATE.openId = id;
    toast('Kendaraan ditambahkan (mode pratinjau — belum tersambung ke Google Sheets, tidak tersimpan permanen).');
    render();
    return;
  }
  STATE.vehicles.push(data);
  STATE.showNewModal = false;
  STATE.openId = id;
  render();
  apiPost({action:'add', data}).then(res=>{
    if(!res || res.ok===false) throw new Error(res && res.error || 'Respons API tidak valid');
    toast('Kendaraan baru berhasil ditambahkan ke Google Sheets.');
  }).catch(err=>{
    toast('Kendaraan tampil di layar tapi GAGAL tersimpan ke Google Sheets: '+(err&&err.message||'tidak diketahui'));
  });
}

/* =========================================================================
   SINKRONISASI (polling — Apps Script tidak mendukung push/realtime asli)
   ========================================================================= */
async function loadVehicles(){
  if(STATE.demoMode || STATE.syncing) return;
  const active = document.activeElement;
  // Jangan timpa field APA PUN yang sedang diisi — sebelumnya cek ini cuma menyisir id
  // berawalan 'f_' (field detail kendaraan), jadi form "Kendaraan Baru" (id nvPolisi dst.)
  // dan gerbang login (gateUserId/gatePassword) tetap bisa tertimpa render() latar
  // belakang tiap kali polling ini jalan (tiap 8 detik) — makanya isian terasa "hilang
  // sendiri" walau sedang aktif mengetik. Sekarang cek berlaku untuk semua kontrol form.
  if(active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName)) return;
  STATE.syncing = true;
  try{
    const res = await apiGet({action:'list'});
    if(!res || res.ok===false) throw new Error(res && res.error || 'Respons API tidak valid');
    STATE.vehicles = res.vehicles || [];
    STATE.connError = '';
    render();
  }catch(err){
    STATE.connError = String((err && err.message) || err);
    toast('Gagal menyegarkan data dari Google Sheets: '+STATE.connError);
  }finally{
    STATE.syncing = false;
  }
}

function startPolling(){
  if(STATE.pollTimer) clearInterval(STATE.pollTimer);
  STATE.pollTimer = setInterval(loadVehicles, POLL_INTERVAL_MS);
}

async function bootApp(){
  if(!API_URL){
    STATE.demoMode = true;
    STATE.connError = '';
    STATE.vehicles = DEMO_VEHICLES.map(v=>({...v}));
    render();
    return;
  }
  try{
    const res = await apiGet({action:'list'});
    if(!res || res.ok===false) throw new Error(res && res.error || 'Respons API tidak valid');
    STATE.vehicles = res.vehicles || [];
    STATE.demoMode = false;
    render();
    startPolling();
  }catch(err){
    STATE.demoMode = true;
    STATE.connError = String((err && err.message) || err);
    STATE.vehicles = DEMO_VEHICLES.map(v=>({...v}));
    render();
  }
}

/* =========================================================================
   EXPORT CSV
   ========================================================================= */
function csvEscape(s){
  const str = String(s??'');
  if(/[",\n]/.test(str)) return '"'+str.replace(/"/g,'""')+'"';
  return str;
}
function exportCSV(){
  const cols = [
    {key:'_no', label:'No Urut'},
    ...ALL_FIELDS.map(f=>({key:f.key, label:f.label, computed:f.type==='computed'})),
  ];
  const header = cols.map(c=>csvEscape(c.label)).join(',');
  const lines = STATE.vehicles.map((v,i)=>{
    const computed = computeDerived(v);
    return cols.map(c=>{
      if(c.key==='_no') return i+1;
      const f = ALL_FIELDS.find(x=>x.key===c.key);
      let val = c.computed ? computed[c.key] : v[c.key];
      if(f && f.type==='checkbox') val = val ? 'Ya' : 'Tidak';
      return csvEscape(val==null?'':val);
    }).join(',');
  });
  const csv = '﻿'+[header, ...lines].join('\n');
  const filename = 'tracking-body-paint-'+todayISO()+'.csv';

  try{
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    toast('File CSV berhasil diunduh (cadangan/salinan offline — data utama sudah tersimpan otomatis di Google Sheets).');
  }catch(err){
    toast('Gagal membuat file CSV: '+(err&&err.message||'tidak diketahui'));
  }
}

/* =========================================================================
   LINK WHATSAPP MANUAL (bukan otomatis — tanpa koneksi API eksternal)
   ========================================================================= */
function waLink(vid){
  const v = STATE.vehicles.find(x=>x.id===vid);
  if(!v) return;
  const phone = normalizePhone(v.no_telp_pemilik);
  const sum = vehicleSummary(v);
  let msg = `Halo${v.nama_pemilik?' '+v.nama_pemilik:''}, update perbaikan Body & Paint untuk kendaraan ${v.brand||''} ${v.model||''} (No. Polisi ${v.no_polisi||'-'}):\n`;
  msg += `Tahap saat ini: ${sum.currentLabel}\n`;
  const targetTgl = targetPenyerahan(v);
  if(targetTgl) msg += `Target penyerahan: ${fmtDate(targetTgl)}${v.reschedule_janji_penyerahan?' (reschedule)':''}\n`;
  if(sum.anyStopped) msg += `Catatan: pekerjaan sedang tertunda (job stoppage), tim kami akan menghubungi Anda.\n`;
  msg += `Terima kasih atas kesabarannya.`;
  if(!phone){
    toast('No. telp pemilik belum diisi / tidak valid.');
    return;
  }
  window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg), '_blank', 'noopener');
}

/* =========================================================================
   EVENT DELEGATION
   ========================================================================= */
document.addEventListener('click', e=>{
  if(e.target.closest('[data-action="do-login"]')){ doLogin(); return; }

  if(e.target.closest('[data-action="logout"]')){
    STATE.currentUser = null;
    STATE.role = null;
    STATE.userName = '';
    STATE.loginUserId = '';
    STATE.loginPassword = '';
    STATE.loginError = '';
    saveSession();
    render();
    return;
  }

  if(e.target.closest('[data-action="export-csv"]')){ exportCSV(); return; }
  if(e.target.closest('[data-action="refresh-now"]')){ loadVehicles(); toast('Menyegarkan data dari Google Sheets…'); return; }

  if(e.target.closest('[data-action="new-vehicle"]')){ STATE.showNewModal = true; render(); return; }
  if(e.target.closest('[data-action="close-modal"]')){ STATE.showNewModal = false; render(); return; }
  if(e.target.matches('[data-action="close-modal-overlay"]')){ STATE.showNewModal = false; render(); return; }

  if(e.target.closest('[data-action="submit-new-vehicle"]')){
    const polisiEl = document.getElementById('nvPolisi');
    const polisi = polisiEl.value.trim();
    if(!polisi){ toast('Nomor Polisi wajib diisi.'); polisiEl.focus(); return; }
    const rangkaEl = document.getElementById('nvRangka');
    const rangka = rangkaEl.value.trim();
    if(!rangka){ toast('No. Rangka wajib diisi.'); rangkaEl.focus(); return; }
    const tahunEl = document.getElementById('nvTahun');
    const data = {
      no_polisi: polisi,
      no_rangka: rangka,
      brand: document.getElementById('nvBrand').value,
      model: document.getElementById('nvModel').value,
      warna: document.getElementById('nvWarna').value,
      transmisi: document.getElementById('nvTransmisi').value,
      tahun: tahunEl.value ? Number(tahunEl.value) : null,
      tipe_customer: document.getElementById('nvTipe').value,
      petugas_sa: document.getElementById('nvSA').value,
      nama_pemilik: document.getElementById('nvNama').value.trim(),
      no_telp_pemilik: normalizePhone(document.getElementById('nvTelp').value),
    };
    addVehicle(data);
    return;
  }

  const row = e.target.closest('[data-action="open-vehicle"]');
  if(row){
    STATE.openId = row.dataset.id;
    STATE.openStageKeys = new Set();
    const v = STATE.vehicles.find(x=>x.id===STATE.openId);
    if(v){
      const sum = vehicleSummary(v);
      const idx = sum.allDone ? 0 : sum.currentIdx;
      STATE.openStageKeys.add(STATE.openId+':'+STAGE_DEFS[idx].key);
    }
    render();
    return;
  }

  if(e.target.closest('[data-action="close-drawer"]')){ STATE.openId=null; render(); return; }
  if(e.target.matches('[data-action="close-drawer-overlay"]')){ STATE.openId=null; render(); return; }

  const stageToggle = e.target.closest('[data-action="toggle-stage"]');
  if(stageToggle){
    const k = stageToggle.dataset.key;
    if(STATE.openStageKeys.has(k)) STATE.openStageKeys.delete(k); else STATE.openStageKeys.add(k);
    render();
    return;
  }

  const waBtn = e.target.closest('[data-action="wa-link"]');
  if(waBtn){ waLink(waBtn.dataset.id); return; }

  const approveBtn = e.target.closest('[data-action="qc-approve"]');
  if(approveBtn && !approveBtn.hasAttribute('disabled')){
    approveQcStage(approveBtn.dataset.stage, approveBtn.dataset.vid);
    return;
  }
});

document.addEventListener('change', e=>{
  const t = e.target;
  if(t.id==='gateShowPassword'){
    STATE.showPassword = t.checked;
    const pw = document.getElementById('gatePassword');
    if(pw) pw.type = STATE.showPassword ? 'text' : 'password';
    return;
  }
  if(t.id==='filterStage'){ STATE.filterStage=t.value; render(); return; }
  if(t.id==='filterCustomer'){ STATE.filterCustomer=t.value; render(); return; }
  if(t.id==='nvBrand'){
    const modelSel = document.getElementById('nvModel');
    const opts = BRAND_MODELS[t.value] || [];
    if(modelSel) modelSel.innerHTML = opts.map(m=>`<option>${esc(m)}</option>`).join('');
    return;
  }
  if(t.dataset && t.dataset.field){
    const vid = t.dataset.vid, key = t.dataset.field;
    let val;
    if(t.type==='checkbox') val = t.checked;
    else if(t.type==='number') val = t.value===''? null : Number(t.value);
    else val = t.value;
    if(key==='no_telp_pemilik' && t.type==='tel') val = normalizePhone(val);
    saveField(vid, key, val);
  }
});

document.addEventListener('input', e=>{
  const t = e.target;
  if(t.id==='searchInput'){ STATE.search = t.value; render(); return; }
  // Simpan nilai User ID/Password ke STATE setiap ketikan (tanpa render ulang) supaya
  // TIDAK hilang kalau ada render() latar belakang (polling Google Sheets tiap 8 detik
  // sudah berjalan sejak boot, termasuk sebelum login) saat user masih mengisi form
  // login — sebelumnya nilai ini cuma dibaca saat submit, jadi kalau polling sempat
  // memanggil render() di tengah pengisian, field jadi tampak "terhapus sendiri".
  if(t.id==='gateUserId'){ STATE.loginUserId = t.value; return; }
  if(t.id==='gatePassword'){ STATE.loginPassword = t.value; return; }
});

document.addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  if(e.target.id==='gateUserId'){ e.preventDefault(); const pw=document.getElementById('gatePassword'); if(pw) pw.focus(); return; }
  if(e.target.id==='gatePassword'){ e.preventDefault(); doLogin(); return; }
});

/* =========================================================================
   BOOT
   ========================================================================= */
render();
bootApp();
</script>
